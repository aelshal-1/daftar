name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # TestFlight builds expire after 90 days; rebuild on the 1st of every month.
  schedule:
    - cron: "0 6 1 * *"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Apple requires uploads built with a current Xcode; macos-26 ships it.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec iosApp/project.yml

      # Runs on every push. Proves the app compiles for a real iPhone, without signing.
      - name: Build for device, unsigned
        if: env.HAS_SIGNING != 'true' || github.event_name == 'pull_request'
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/Daftar.xcodeproj \
            -scheme Daftar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*Shared|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      # Runs once the Apple signing secrets are added. See docs/ios-signing.md.
      - uses: ruby/setup-ruby@v1
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Sign and upload to TestFlight
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta
