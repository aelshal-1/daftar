# XcodeGen spec. CI runs `xcodegen generate` to create Daftar.xcodeproj; never edit the generated project.
name: Daftar
options:
  bundleIdPrefix: com.aelshal
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  Daftar:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Daftar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Compose Multiplatform checks this key at startup.
        CADisableMinimumFrameDurationOnPhone: true
        # The app only uses standard HTTPS, so no export compliance questions in TestFlight.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Daftar
        PRODUCT_BUNDLE_IDENTIFIER: com.aelshal.daftar
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # The Gradle build phase needs to run outside Xcode's script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin has no Intel simulator target.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    scheme: {}
